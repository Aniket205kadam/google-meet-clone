name: Build & Deploy Namaskar backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  build-deploy:
    name: Build and Deploy Namaskar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21

      - name: Run unit test
        run: mvn -B test --file pom.xml

      - name: Build the backend
        run: |
          mvn clean
          mvn -B package --file pom.xml

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/namaskar-backend:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/namaskar-backend:latest

      - name: Trigger Render redeploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  notify:
    name: Send email alert
    runs-on: ubuntu-latest
    needs: build-deploy
    if: always()
    steps:
      - name: Send Success email
        if: needs.build-deploy.result == 'success'
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          subject: "Namaskar Backend Build & Deploy Success"
          body: |
            Build & Deploy for Namaskar backend succeeded.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure email
        if: needs.build-deploy.result == 'failure'
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          subject: "Namaskar Backend Build & Deploy Failure"
          body: |
            Build & Deploy for Namaskar backend FAILED.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}